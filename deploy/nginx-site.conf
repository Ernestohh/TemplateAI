# nginx site for {{DOMAIN}} (static files from scripts/build_site.py -> site-dist/, uploaded by
# scripts/deploy_server.sh to {{DEPLOY_DIR}}).
# Install: bash scripts/server_setup.sh (or by hand: copy to /etc/nginx/sites-available/{{DOMAIN}},
# symlink into sites-enabled/, `nginx -t && systemctl reload nginx`, then `certbot --nginx -d {{DOMAIN}}`,
# which adds the 443 block and the redirect).
server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    root {{DEPLOY_DIR}};
    index index.html;

    # The service worker must never be cached, or players keep an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    # Pages: always revalidate.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Hashed build assets: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Music (lazy-loaded) and fonts: cache for a week.
    location ~* \.(ogg|opus|mp3|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # Trailer and progress videos: allow seeking.
    location ~* \.(mp4|webm)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
